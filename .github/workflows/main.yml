name: Screenshot cards

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs: 
  screenshot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Puppeteer
      run: npm install puppeteer

    - name: Create screenshot script
      run: |
        cat <<'EOF' > screenshot.js
        const puppeteer = require('puppeteer');

        (async () => {
          const browser = await puppeteer.launch();
          const page = await browser.newPage();

          await page.goto(`file://${process.cwd()}/cards.html`);
          await page.setViewport({ width: 1200, height: 800 });
          await page.screenshot({ path: 'cards.png', fullPage: true });

          await browser.close();
          console.log('Screenshot gerado: cards.png');
        })();
        EOF

    - name: Run Puppeteer
      run: node screenshot.js

    - name: Commit and push screenshot
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add cards.png
        git commit -m "Update cards.png screenshot" || echo "No changes to commit"
        git push
