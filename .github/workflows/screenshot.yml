name: Screenshot cards

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs: 
  screenshot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Puppeteer
      run: npm install puppeteer

    - name: Create screenshot script
      run: |
        cat <<'EOF' > screenshot.js
        const puppeteer = require('puppeteer');

        (async () => {
          const browser = await puppeteer.launch({
            args: ['--no-sandbox', '--disable-setuid-sandbox']
          });

          const page = await browser.newPage();

          await page.goto(`file://${process.cwd()}/cards.html`);
          await page.setViewport({ width: 1024, height: 600 });

          const elements = await page.$('section');
          await elements.screenshot({ path: 'all-cards.png' });

          const cardOne = await page.$('.card.one');
          await cardOne.screenshot({ path: 'card-one.png' });

          const cardTwo = await page.$('.card.two');
          await cardTwo.screenshot({ path: 'card-two.png' });

          const cardThree = await page.$('.card.three');
          await cardThree.screenshot({ path: 'card-three.png' });

          const cardFour = await page.$('.card.four');
          await cardFour.screenshot({ path: 'card-four.png' });

          await browser.close();
          console.log('Screenshot gerado: cards.png');
        })();
        EOF

    - name: Run Puppeteer
      run: node screenshot.js

    - name: Commit and push screenshot
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add all-cards.png
        git add card-one.png
        git add card-two.png
        git add card-three.png
        git add card-four.png
        git commit -m "Update cards screenshots" || echo "No changes to commit"
        git push


  repo_langs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Get repository languages
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
      run: |
        python - <<'PY'
        import os
        import sys
        import requests

        def get_all_repos(token):
            url = "https://api.github.com/orgs/lauraFCa/repos"
            headers = {
                "Authorization": f"Bearer {token}",
                "Accept": "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
            }
            resp = requests.get(url, headers=headers)
            resp.raise_for_status()
            return [repo["name"] for repo in resp.json()]

        def get_repo_langs(repo, token):
            headers = {
                "Authorization": f"Bearer {token}",
                "Accept": "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
            }
            url = f"https://api.github.com/repos/lauraFCa/{repo}/languages"
            resp = requests.get(url, headers=headers)
            resp.raise_for_status()
            return resp.json()

        def main():
            token = os.getenv("GITHUB_TOKEN")
            if not token:
                print("GITHUB_TOKEN not set", file=sys.stderr)
                sys.exit(1)

            repos = get_all_repos(token)
            for repo in repos:
                langs = get_repo_langs(repo, token)
                names = ', '.join(langs.keys()) if langs else 'none'
                print(f"{repo}: {names}")
                lines.append(f"- {repo}: {names}")

            with open('repo_langs.md', 'w', encoding='utf-8') as f:
              f.write("## Repository languages\n\n")
              f.write("\n".join(lines))
              f.write("\n")

        if __name__ == "__main__":
            main()
        PY


    - name: Print langs to summary
      run: cat repo_langs.md >> $GITHUB_STEP_SUMMARY
      