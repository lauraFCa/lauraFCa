name: Screenshot cards

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs: 
  screenshot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Puppeteer
      run: npm install puppeteer

    - name: Create screenshot script
      run: |
        cat <<'EOF' > screenshot.js
        const puppeteer = require('puppeteer');

        (async () => {
          const browser = await puppeteer.launch({
            args: ['--no-sandbox', '--disable-setuid-sandbox']
          });

          const page = await browser.newPage();

          await page.goto(`file://${process.cwd()}/cards.html`);
          // Full desktop viewport for the section screenshot
          await page.setViewport({ width: 1024, height: 600 });

          const elements = await page.$('section');
          await elements.screenshot({ path: `${process.cwd()}/imgs/all-cards.png` });

          // Switch to mobile width (375px) before taking individual card screenshots.
          // Also force each card element to be 375px wide so the resulting PNG has the expected width.
          await page.setViewport({ width: 375, height: 800 });
          await page.evaluate(() => {
            document.querySelectorAll('.card').forEach(el => {
              el.style.boxSizing = 'border-box';
              el.style.width = '375px';
              el.style.maxWidth = '375px';
            });
          });

          const cardOne = await page.$('.card.one');
          await cardOne.screenshot({ path: `${process.cwd()}/imgs/card-one.png` });

          const cardTwo = await page.$('.card.two');
          await cardTwo.screenshot({ path: `${process.cwd()}/imgs/card-two.png` });

          const cardThree = await page.$('.card.three');
          await cardThree.screenshot({ path: `${process.cwd()}/imgs/card-three.png` });

          const cardFour = await page.$('.card.four');
          await cardFour.screenshot({ path: `${process.cwd()}/imgs/card-four.png` });

          await browser.close();
          console.log('Screenshot gerado: cards.png');
        })();
        EOF

    - name: Run Puppeteer
      run: node screenshot.js

    - name: Commit and push screenshot
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git pull
        git add imgs/*.png
        git commit -m "Update cards screenshots" || echo "No changes to commit"
        git push


  repo_langs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Get repository languages
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
      run: |
        python - <<'PY'
        import os
        import sys
        import requests

        def get_all_repos(token):
            url = "https://api.github.com/users/lauraFCa/repos"
            headers = {
                "Authorization": f"Bearer {token}",
                "Accept": "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
            }
            resp = requests.get(url, headers=headers)
            resp.raise_for_status()
            return [repo["name"] for repo in resp.json()]

        def get_repo_langs(repo, token):
            headers = {
                "Authorization": f"Bearer {token}",
                "Accept": "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
            }
            url = f"https://api.github.com/repos/lauraFCa/{repo}/languages"
            resp = requests.get(url, headers=headers)
            resp.raise_for_status()
            return resp.json()


        def create_ranking(langs):
          frequencias = {}
          N_TOTAL = len(langs)
          for item in langs:
            frequencias[item] = frequencias.get(item, 0) + 1
          ranking_ordenado = sorted(frequencias.items(), key=lambda item: item[1], reverse=True)
          
          print("\nSaída do Ranking com Porcentagem:")
          saida = ""
          for i, (item, contagem) in enumerate(ranking_ordenado):
              porcentagem = (contagem / N_TOTAL) * 100
              print(f"{item} - {porcentagem:.0f}%")
              saida += f"- {item} - {porcentagem:.0f}%  \n"
          return saida


        def main():
            token = os.getenv("GITHUB_TOKEN")
            lines_md = []

            lang_names = []

            if not token:
                print("GITHUB_TOKEN not set", file=sys.stderr)
                sys.exit(1)

            repos = get_all_repos(token)
            for repo in repos:
                langs = get_repo_langs(repo, token)
                languages = langs.keys()
                names = ', '.join(languages) if langs else 'none'
                lang_names.extend(languages)
                print(f"{repo}: {names}")
                lines_md.append(f"- {repo}: {names}")

            with open('repo_langs.md', 'w', encoding='utf-8') as f:
              f.write("## Repository languages\n\n")
              f.write("\n".join(lines_md))
              f.write("\n")

            top_lang = create_ranking(lang_names)

            # Save the ranking text so the workflow can insert it into the README
            with open('top_lang.txt', 'w', encoding='utf-8') as f:
              f.write(top_lang)


        if __name__ == "__main__":
            main()
        PY



        
    - name: upload files
      uses: actions/upload-artifact@v5.0.0
      with:
        name: repo_langs
        path: repo_langs.*
        if-no-files-found: warn


    - name: Insert top_lang into README and push
      env:
        TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      run: |
        python - <<'PY'
        from pathlib import Path

        readme = Path('readme.md')
        top_file = Path('top_lang.txt')
        if readme.exists() and top_file.exists():
            content = readme.read_text(encoding='utf-8')
            top = top_file.read_text(encoding='utf-8').strip()
            start = content.find('Top Languages:')
            if start != -1:
                br_idx = content.find('<br>', start)
                if br_idx != -1:
                    # keep the 'Top Languages:  ' line, replace everything between it and the <br>
                    line_end = content.find('\n', start)
                    if line_end == -1:
                        line_end = start + len('Top Languages:  ')
                    prefix = content[:line_end+1]
                    suffix = content[br_idx:]
                    new_content = prefix + top + '\n\n' + suffix
                    readme.write_text(new_content, encoding='utf-8')
                    print('README updated')
                else:
                    print('<br> tag not found after Top Languages:, skipping README update')
            else:
                print('Top Languages: not found in README, skipping')
        else:
            print('readme.md or top_lang.txt not found, skipping')
        PY

                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"
                git pull
                git add readme.md || true
                git add top_lang.txt || true
                git commit -m "Update Top Languages in readme" || echo "No changes to commit"
                git push https://x-access-token:${{ secrets.TOKEN_GITHUB }}@github.com/${{ github.repository }}.git HEAD:main || echo "Push failed"


    - name: Print langs to summary
      run: cat repo_langs.md >> $GITHUB_STEP_SUMMARY
      